name: wayne-command-center-ci

# Required status check "app" for branch protection on main. Ships with the Wayne Command Center
# pull request, so the app is checked on its own PR independently of the Wayne Protocol PR.
# Runs on every pull request and push to main; skips its work when the app is absent, so a
# required check never blocks an unrelated pull request.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wayne-command-center-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f wayne-command-center/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No Wayne Command Center in this revision - skipping."; fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wayne-command-center/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        working-directory: wayne-command-center
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        name: Typecheck, lint, unit tests
        working-directory: wayne-command-center
        run: npm run check
      - if: steps.detect.outputs.present == 'true'
        name: Migrations and RLS tests (local PostgreSQL)
        working-directory: wayne-command-center
        run: npm run test:db
      - if: steps.detect.outputs.present == 'true'
        name: Production build
        working-directory: wayne-command-center
        run: npm run build
